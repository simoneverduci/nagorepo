<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAGOREPO — digital grimoire</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

:root {
  --bg: #0a0b0e;
  --fg: #c8d6c0;
  --accent: #00ff41;
  --dim: #2a3a2a;
  --glow: 0 0 8px rgba(0,255,65,0.3);
  --radius: 4px;
}

* { margin:0; padding:0; box-sizing:border-box; }

html, body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Space Mono', monospace;
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── sigil backdrop ── */
#sigil-backdrop {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  opacity: 0.35;
  pointer-events: none;
}
#sigil-backdrop svg {
  width: 100%;
  height: 100%;
}
.aura-ring { animation: pulseGlow 8s ease-in-out infinite alternate; }
@keyframes pulseGlow {
  0%   { opacity: 0.04; }
  100% { opacity: 0.12; }
}

.sigil-spin {
  transform-origin: center;
  animation: spin 30s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
.sigil-spin-reverse {
  transform-origin: center;
  animation: spinReverse 20s linear infinite;
}
@keyframes spinReverse {
  to { transform: rotate(-360deg); }
}
.sigil-float {
  animation: floatSlow 6s ease-in-out infinite alternate;
}
@keyframes floatSlow {
  0%   { transform: translateY(-2px); }
  100% { transform: translateY(2px); }
}
.rune-symbol { opacity: 0.5; transition: opacity 0.3s; }
.rune-symbol:hover { opacity: 1; }

/* ── page layout ── */
#app {
  position: relative;
  z-index: 1;
  max-width: 820px;
  margin: 0 auto;
  padding: 20px 24px 60px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── terminal area ── */
#terminal {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

/* ASCII art — always pre-formatted, never collapses */
#title-art {
  white-space: pre;
  font-size: 11px;
  line-height: 1.15;
  color: var(--accent);
  text-shadow: var(--glow);
  margin: 8px 0;
}

/* Boot text types into this div */
#boot-text {
  white-space: pre-wrap;
  overflow-wrap: break-word;
  min-height: 1em;
}

#obsession {
  margin: 18px 0 12px;
  padding: 10px 14px;
  border-left: 3px solid var(--accent);
  background: rgba(0,255,65,0.04);
  font-size: 13px;
}
#obsession .label {
  color: #00cc88;
  font-weight: 700;
  letter-spacing: 1px;
}
#obsession .text {
  color: var(--accent);
}

#fragments {
  flex: 1;
  margin: 8px 0;
}
.frag-entry {
  margin: 6px 0;
  padding: 6px 10px;
  border-left: 1px solid var(--dim);
  font-size: 12px;
}
.frag-entry .src {
  color: #00cc88;
  font-size: 11px;
}
.frag-entry .txt {
  color: var(--fg);
  opacity: 0.85;
}
.frag-entry.collision-denies {
  border-left-color: #ff0044;
}
.frag-entry.collision-complicates {
  border-left-color: #8844ff;
}
.frag-entry.collision-collision {
  border-left-color: #ff6600;
}

#footer-bar {
  margin-top: 20px;
  padding: 8px 0;
  border-top: 1px solid var(--dim);
  font-size: 11px;
  color: #555;
  display: flex;
  justify-content: space-between;
}

/* ── commands ── */
#output { font-size: 12px; white-space: pre-wrap; }

#input-line {
  display: flex;
  align-items: center;
  margin-top: 8px;
  font-size: 14px;
}
#input-line .prompt {
  color: var(--accent);
  margin-right: 6px;
}
#cmd-input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--fg);
  font: inherit;
  caret-color: var(--accent);
}
#cmd-input::placeholder { color: #333; }

/* ── responsive ── */
@media (max-width: 600px) {
  #app { padding: 12px 12px 40px; }
  #title-art { font-size: 7px; }
  .sigil-spin, .sigil-spin-reverse { animation: none; }
}

/* ── transition overlay ── */
#burn-cover {
  position: fixed; inset: 0; z-index: 1000;
  background: var(--bg);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s;
}
#burn-cover.active { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>

<div id="sigil-backdrop"></div>

<div id="app">
  <div id="terminal">
    <pre id="title-art"></pre>
    <div id="boot-text"></div>
    <div id="obsession"></div>
    <div id="fragments"></div>
    <div id="output"></div>
    <div id="input-line">
      <span class="prompt">❯</span>
      <input id="cmd-input" type="text" placeholder="type help" autofocus spellcheck="false" autocomplete="off">
    </div>
    <div id="footer-bar">
      <span id="foot-cycle"></span>
      <span id="foot-run"></span>
      <span id="foot-built"></span>
    </div>
  </div>
</div>

<div id="burn-cover"></div>

<script>
  /* state.js is generated by grimoire.py on every build cycle */
</script>
<script src="state.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════
// ASCII ART
// ═══════════════════════════════════════════════════════════════
const ART = `███╗   ██╗ █████╗  ██████╗  ██████╗ ██████╗ ███████╗██████╗  ██████╗
████╗  ██║██╔══██╗██╔════╝ ██╔═══██╗██╔══██╗██╔════╝██╔══██╗██╔═══██╗
██╔██╗ ██║███████║██║  ███╗██║   ██║██████╔╝█████╗  ██████╔╝██║   ██║
██║╚██╗██║██╔══██║██║   ██║██║   ██║██╔══██╗██╔══╝  ██╔═══╝ ██║   ██║
██║ ╚████║██║  ██║╚██████╔╝╚██████╔╝██║  ██║███████╗██║     ╚██████╔╝
╚═╝  ╚═══╝╚═╝  ╚═╝ ╚═════╝  ╚═════╝ ╚═╝  ╚═╝╚══════╝╚═╝      ╚═════╝`.trim();

const BOOT_LINES = [
  `[${new Date().toISOString().slice(0,10).replace(/-/g,'-')} ${new Date().toLocaleTimeString('en-GB',{hour12:false})}] WAKE sequence initiated.`,
  'memory registers loaded · sigil engine warm · obsession pool primed',
  'the grimoire is not written. it is found — unearthed from what you have already read.',
  'every page is a fragment of a book simone touched, and every sigil is a map of the collision between two registers that were never supposed to meet.',
  'type help to begin. or just watch. the grimoire mutates without you.',
];

// ═══════════════════════════════════════════════════════════════
// SIGIL ENGINE — v2: golden spiral + woven paths + rune ring
// ═══════════════════════════════════════════════════════════════

const PHI = 1.618033988749895;
const SVGNS = 'http://www.w3.org/2000/svg';
const PI = Math.PI;
const TAU = 2 * PI;

function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function hashString(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) {
    h = ((h << 5) - h) + str.charCodeAt(i);
    h |= 0;
  }
  return Math.abs(h);
}

function generateRune(rng, cx, cy, scale) {
  /* Generate a small occult-looking glyph from a seeded RNG */
  const parts = [];
  const strokes = 3 + Math.floor(rng() * 5);
  for (let i = 0; i < strokes; i++) {
    const ax = (rng() - 0.5) * 2 * scale;
    const ay = (rng() - 0.5) * 2 * scale;
    const bx = (rng() - 0.5) * 2 * scale;
    const by = (rng() - 0.5) * 2 * scale;
    if (rng() > 0.5) {
      // straight line
      parts.push(`M${cx+ax},${cy+ay}L${cx+bx},${cy+by}`);
    } else {
      // arc
      const cpx = (rng() - 0.5) * 3 * scale;
      const cpy = (rng() - 0.5) * 3 * scale;
      parts.push(`M${cx+ax},${cy+ay}Q${cx+cpx},${cy+cpy},${cx+bx},${cy+by}`);
    }
  }
  // Add 1-3 circles
  const nCircles = 1 + Math.floor(rng() * 3);
  for (let i = 0; i < nCircles; i++) {
    const cx2 = (rng() - 0.5) * 2.5 * scale;
    const cy2 = (rng() - 0.5) * 2.5 * scale;
    const cr = 0.5 + rng() * 1.2 * scale;
    parts.push(`M${cx+cx2+cr},${cy+cy2}A${cr},${cr},0,1,0,${cx+cx2-cr},${cy+cy2}A${cr},${cr},0,1,0,${cx+cx2+cr},${cy+cy2}`);
  }
  return parts.join(' ');
}

function buildSigil(seed, state) {
  const backdrop = document.getElementById('sigil-backdrop');
  const rng = mulberry32(hashString(String(seed)));

  const params = (state && state.sigil_params) || {
    rings: 7, twist: 1.2, weave_density: 3, pulse_speed: 4,
    palette: ['#00ff41','#008f11','#005f00','#00ffaa'],
    bg_alpha: 0.05, rune_count: 12, center_emblem: 2,
  };

  const pal = params.palette;
  const rings = Math.min(Math.max(params.rings || 7, 4), 14);
  const twist = params.twist || 1.0;
  const runeCount = params.rune_count || 12;
  const centerEm = params.center_emblem || 0;

  const svg = document.createElementNS(SVGNS, 'svg');
  svg.setAttribute('viewBox', '-280 -280 560 560');
  svg.setAttribute('preserveAspectRatio', 'xMidYMid slice');

  const defs = document.createElementNS(SVGNS, 'defs');
  // Glow filter
  const filter = document.createElementNS(SVGNS, 'filter');
  filter.setAttribute('id', 'glow');
  filter.setAttribute('x', '-50%');
  filter.setAttribute('y', '-50%');
  filter.setAttribute('width', '200%');
  filter.setAttribute('height', '200%');
  const blur = document.createElementNS(SVGNS, 'feGaussianBlur');
  blur.setAttribute('stdDeviation', '2.5');
  blur.setAttribute('result', 'coloredBlur');
  filter.appendChild(blur);
  const merge = document.createElementNS(SVGNS, 'feMerge');
  const mn1 = document.createElementNS(SVGNS, 'feMergeNode');
  mn1.setAttribute('in', 'coloredBlur');
  merge.appendChild(mn1);
  const mn2 = document.createElementNS(SVGNS, 'feMergeNode');
  mn2.setAttribute('in', 'SourceGraphic');
  merge.appendChild(mn2);
  filter.appendChild(merge);
  defs.appendChild(filter);

  // Stronger glow
  const filter2 = document.createElementNS(SVGNS, 'filter');
  filter2.setAttribute('id', 'glow-strong');
  filter2.setAttribute('x', '-100%');
  filter2.setAttribute('y', '-100%');
  filter2.setAttribute('width', '300%');
  filter2.setAttribute('height', '300%');
  const blur2 = document.createElementNS(SVGNS, 'feGaussianBlur');
  blur2.setAttribute('stdDeviation', '5');
  blur2.setAttribute('result', 'coloredBlur');
  filter2.appendChild(blur2);
  const merge2 = document.createElementNS(SVGNS, 'feMerge');
  const mn2_1 = document.createElementNS(SVGNS, 'feMergeNode');
  mn2_1.setAttribute('in', 'coloredBlur');
  merge2.appendChild(mn2_1);
  const mn2_2 = document.createElementNS(SVGNS, 'feMergeNode');
  mn2_2.setAttribute('in', 'SourceGraphic');
  merge2.appendChild(mn2_2);
  filter2.appendChild(merge2);
  defs.appendChild(filter2);
  svg.appendChild(defs);

  // ── 0. Background aura rings ──
  for (let i = 7; i >= 1; i--) {
    const r = 40 * i;
    const c = document.createElementNS(SVGNS, 'circle');
    c.setAttribute('cx', '0'); c.setAttribute('cy', '0');
    c.setAttribute('r', r);
    c.setAttribute('fill', 'none');
    c.setAttribute('stroke', pal[i % pal.length]);
    c.setAttribute('stroke-width', `${0.3 + (7-i)*0.1}`);
    c.setAttribute('opacity', params.bg_alpha / i);
    c.setAttribute('class', 'aura-ring');
    svg.appendChild(c);
  }

  // ── 1. Golden spiral points ──
  const N = 16 + rings * 4;
  const points = [];
  for (let i = 0; i < N; i++) {
    const t = (i + 0.5) / N;
    const angle = TAU * PHI * i * (1 + 0.02 * (twist - 1));
    const radius = Math.sqrt(t) * 190 + 8;
    const x = Math.cos(angle) * radius;
    const y = Math.sin(angle) * radius;
    points.push({x, y, angle, radius, t});
  }

  // ── 2. Weave paths (bezier connections) ──
  const gWeave = document.createElementNS(SVGNS, 'g');
  gWeave.setAttribute('class', 'sigil-spin');
  const weaveDensity = Math.min(params.weave_density || 3, 6);

  for (let i = 0; i < points.length; i++) {
    const p = points[i];
    // Find nearest neighbors not on the same ring
    const dists = points.map((q, j) => ({idx: j, d: Math.hypot(q.x - p.x, q.y - p.y)}));
    dists.sort((a,b) => a.d - b.d);
    const neighbors = dists.slice(1, 1 + weaveDensity).filter(n => n.d < 100);
    const color = pal[(Math.floor(p.angle / TAU * 10) + 1) % pal.length];
    for (const n of neighbors) {
      const q = points[n.idx];
      // Bezier control point at midpoint + perpendicular offset
      const mx = (p.x + q.x) / 2;
      const my = (p.y + q.y) / 2;
      const dx = q.y - p.y;
      const dy = -(q.x - p.x);
      const dl = Math.hypot(dx, dy) || 1;
      const offset = (rng() - 0.5) * 30 * twist;
      const cpx = mx + (dx / dl) * offset;
      const cpy = my + (dy / dl) * offset;
      const path = document.createElementNS(SVGNS, 'path');
      path.setAttribute('d', `M${p.x.toFixed(1)},${p.y.toFixed(1)} Q${cpx.toFixed(1)},${cpy.toFixed(1)} ${q.x.toFixed(1)},${q.y.toFixed(1)}`);
      path.setAttribute('stroke', color);
      path.setAttribute('stroke-width', `${0.2 + rng() * 0.5}`);
      path.setAttribute('fill', 'none');
      path.setAttribute('opacity', `${0.1 + rng() * 0.25}`);
      path.setAttribute('filter', 'url(#glow)');
      gWeave.appendChild(path);
    }
  }
  svg.appendChild(gWeave);

  // ── 3. Concentric sigil rings (mandala) ──
  const gRings = document.createElementNS(SVGNS, 'g');
  gRings.setAttribute('class', 'sigil-spin-reverse');
  for (let i = 0; i < rings; i++) {
    const n_pts = 6 + i * 2;
    const r = 25 + i * (168 / Math.max(rings, 1));
    const offset = rng() * TAU;
    const color = pal[i % pal.length];
    let d = '';
    for (let j = 0; j < n_pts; j++) {
      const a = offset + (j / n_pts) * TAU;
      const wobble = (rng() - 0.5) * twist * 6;
      const rr = r + wobble;
      const x = Math.cos(a) * rr;
      const y = Math.sin(a) * rr;
      d += (j === 0 ? 'M' : 'L') + `${x.toFixed(1)},${y.toFixed(1)}`;
    }
    d += 'Z';
    const poly = document.createElementNS(SVGNS, 'path');
    poly.setAttribute('d', d);
    poly.setAttribute('fill', 'none');
    poly.setAttribute('stroke', color);
    poly.setAttribute('stroke-width', `${0.4 + rng() * 0.4}`);
    poly.setAttribute('opacity', `${0.15 + (i / rings) * 0.25}`);
    poly.setAttribute('filter', 'url(#glow)');
    gRings.appendChild(poly);

    // Inner dash circle
    const cc = document.createElementNS(SVGNS, 'circle');
    cc.setAttribute('cx', '0'); cc.setAttribute('cy', '0');
    cc.setAttribute('r', r);
    cc.setAttribute('fill', 'none');
    cc.setAttribute('stroke', color);
    cc.setAttribute('stroke-width', '0.3');
    cc.setAttribute('stroke-dasharray', `${2 + rng() * 4} ${4 + rng() * 8}`);
    cc.setAttribute('opacity', `${0.08 + (i / rings) * 0.15}`);
    gRings.appendChild(cc);
  }
  svg.appendChild(gRings);

  // ── 4. Outer rune ring ──
  const gRunes = document.createElementNS(SVGNS, 'g');
  gRunes.setAttribute('class', 'sigil-float');
  const runeR = 222;
  for (let i = 0; i < runeCount; i++) {
    const a = (i / runeCount) * TAU;
    const cx = Math.cos(a) * runeR;
    const cy = Math.sin(a) * runeR;
    const scale = 3 + rng() * 4;
    const runeD = generateRune(rng, cx, cy, scale);
    const path = document.createElementNS(SVGNS, 'path');
    path.setAttribute('d', runeD);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', pal[i % pal.length]);
    path.setAttribute('stroke-width', '0.5');
    path.setAttribute('opacity', '0.4');
    path.setAttribute('class', 'rune-symbol');
    gRunes.appendChild(path);
  }
  svg.appendChild(gRunes);

  // ── 5. Center emblem ──
  const gCenter = document.createElementNS(SVGNS, 'g');
  gCenter.setAttribute('class', 'sigil-float');
  const emblemTypes = [
    // eye/seed (nested circles with cross)
    () => {
      for (let i = 3; i >= 1; i--) {
        const c = document.createElementNS(SVGNS, 'circle');
        c.setAttribute('cx', '0'); c.setAttribute('cy', '0');
        c.setAttribute('r', i * 6);
        c.setAttribute('fill', 'none');
        c.setAttribute('stroke', pal[0]);
        c.setAttribute('stroke-width', '0.8');
        c.setAttribute('opacity', 0.6);
        gCenter.appendChild(c);
      }
      for (let i = 0; i < 4; i++) {
        const a = (i / 4) * TAU + TAU/8;
        const l = document.createElementNS(SVGNS, 'line');
        l.setAttribute('x1', '0'); l.setAttribute('y1', '0');
        l.setAttribute('x2', Math.cos(a) * 18); l.setAttribute('y2', Math.sin(a) * 18);
        l.setAttribute('stroke', pal[1]);
        l.setAttribute('stroke-width', '0.6');
        l.setAttribute('opacity', 0.4);
        gCenter.appendChild(l);
      }
    },
    // diamond
    () => {
      const pts = [[0,-15],[15,0],[0,15],[-15,0]];
      let d = pts.map((p,i) => `${i===0?'M':'L'}${p[0]},${p[1]}`).join('')+'Z';
      const diamond = document.createElementNS(SVGNS, 'path');
      diamond.setAttribute('d', d);
      diamond.setAttribute('fill', 'none');
      diamond.setAttribute('stroke', pal[0]);
      diamond.setAttribute('stroke-width', '0.8');
      gCenter.appendChild(diamond);
      const cc = document.createElementNS(SVGNS, 'circle');
      cc.setAttribute('cx', '0'); cc.setAttribute('cy', '0');
      cc.setAttribute('r', '8');
      cc.setAttribute('fill', 'none');
      cc.setAttribute('stroke', pal[1]);
      cc.setAttribute('stroke-width', '0.5');
      cc.setAttribute('stroke-dasharray', '2 3');
      gCenter.appendChild(cc);
    },
    // triskelion (3-fold)
    () => {
      for (let i = 0; i < 3; i++) {
        const a = (i / 3) * TAU;
        const x = Math.cos(a) * 10;
        const y = Math.sin(a) * 10;
        const path = document.createElementNS(SVGNS, 'path');
        path.setAttribute('d', `M0,0Q${x*1.5},${y*1.5} ${x},${y}`);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', pal[i % pal.length]);
        path.setAttribute('stroke-width', '0.8');
        path.setAttribute('opacity', 0.6);
        gCenter.appendChild(path);
        const dot = document.createElementNS(SVGNS, 'circle');
        dot.setAttribute('cx', x); dot.setAttribute('cy', y);
        dot.setAttribute('r', '2');
        dot.setAttribute('fill', pal[i % pal.length]);
        dot.setAttribute('opacity', 0.4);
        gCenter.appendChild(dot);
      }
    },
    // cross within circle (alchemical salt)
    () => {
      const c = document.createElementNS(SVGNS, 'circle');
      c.setAttribute('cx', '0'); c.setAttribute('cy', '0');
      c.setAttribute('r', '14');
      c.setAttribute('fill', 'none');
      c.setAttribute('stroke', pal[0]);
      c.setAttribute('stroke-width', '0.8');
      gCenter.appendChild(c);
      const h = document.createElementNS(SVGNS, 'line');
      h.setAttribute('x1', '-10'); h.setAttribute('y1', '0');
      h.setAttribute('x2', '10'); h.setAttribute('y2', '0');
      h.setAttribute('stroke', pal[1]); h.setAttribute('stroke-width', '0.6');
      gCenter.appendChild(h);
      const v = document.createElementNS(SVGNS, 'line');
      v.setAttribute('x1', '0'); v.setAttribute('y1', '-10');
      v.setAttribute('x2', '0'); v.setAttribute('y2', '10');
      v.setAttribute('stroke', pal[1]); v.setAttribute('stroke-width', '0.6');
      gCenter.appendChild(v);
    },
    // 5-pointed star
    () => {
      let d = '';
      for (let i = 0; i < 5; i++) {
        const outer = (i * 2 * PI / 5) - PI/2;
        const inner = outer + PI/5;
        const ox = Math.cos(outer) * 14, oy = Math.sin(outer) * 14;
        const ix = Math.cos(inner) * 6, iy = Math.sin(inner) * 6;
        d += (i === 0 ? 'M' : 'L') + `${ox},${oy}L${ix},${iy}`;
      }
      d += 'Z';
      const star = document.createElementNS(SVGNS, 'path');
      star.setAttribute('d', d);
      star.setAttribute('fill', 'none');
      star.setAttribute('stroke', pal[0]);
      star.setAttribute('stroke-width', '0.7');
      gCenter.appendChild(star);
    },
    // spiraling dots
    () => {
      for (let i = 0; i < 24; i++) {
        const t = i / 24;
        const a = TAU * t;
        const r = t * 14;
        const dot = document.createElementNS(SVGNS, 'circle');
        dot.setAttribute('cx', Math.cos(a) * r);
        dot.setAttribute('cy', Math.sin(a) * r);
        dot.setAttribute('r', `${0.3 + t * 0.5}`);
        dot.setAttribute('fill', pal[Math.floor(t * 4) % pal.length]);
        dot.setAttribute('opacity', `${0.1 + t * 0.4}`);
        gCenter.appendChild(dot);
      }
    },
  ];
  emblemTypes[Math.min(centerEm, emblemTypes.length - 1)]();
  svg.appendChild(gCenter);

  // ── 6. Obsession text on arc ──
  if (state && state.obsession) {
    const gText = document.createElementNS(SVGNS, 'g');
    const arcPath = document.createElementNS(SVGNS, 'path');
    const arcR = 240;
    const arcId = 'obsession-arc-' + Date.now();
    arcPath.setAttribute('id', arcId);
    arcPath.setAttribute('d', `M${-arcR*0.9},0A${arcR},${arcR},0,0,1,${arcR*0.9},0`);
    arcPath.setAttribute('fill', 'none');
    arcPath.setAttribute('stroke', 'none');
    gText.appendChild(arcPath);

    const text = document.createElementNS(SVGNS, 'text');
    text.setAttribute('font-size', '8');
    text.setAttribute('font-family', 'Space Mono, monospace');
    text.setAttribute('fill', pal[2]);
    text.setAttribute('opacity', '0.4');
    text.setAttribute('filter', 'url(#glow)');
    const tp = document.createElementNS(SVGNS, 'textPath');
    tp.setAttribute('href', '#' + arcId);
    tp.setAttribute('startOffset', '50%');
    tp.setAttribute('text-anchor', 'middle');
    let obsession = state.obsession;
    // Truncate if too long
    if (obsession.length > 80) {
      obsession = obsession.slice(0, 77) + '...';
    }
    tp.textContent = obsession.toUpperCase();
    text.appendChild(tp);
    gText.appendChild(text);

    // Second arc below
    const arcPath2 = document.createElementNS(SVGNS, 'path');
    const arcId2 = 'obsession-arc2-' + Date.now();
    arcPath2.setAttribute('id', arcId2);
    arcPath2.setAttribute('d', `M${-arcR*0.6},0A${arcR*0.66},${arcR*0.66},0,0,0,${arcR*0.6},0`);
    arcPath2.setAttribute('fill', 'none');
    arcPath2.setAttribute('stroke', 'none');
    gText.appendChild(arcPath2);

    if (state.collision && state.collision !== 'seed cycle' && state.collision !== 'exploring') {
      const text2 = document.createElementNS(SVGNS, 'text');
      text2.setAttribute('font-size', '7');
      text2.setAttribute('font-family', 'Space Mono, monospace');
      text2.setAttribute('fill', pal[3]);
      text2.setAttribute('opacity', '0.3');
      const tp2 = document.createElementNS(SVGNS, 'textPath');
      tp2.setAttribute('href', '#' + arcId2);
      tp2.setAttribute('startOffset', '50%');
      tp2.setAttribute('text-anchor', 'middle');
      let collision = state.collision;
      if (collision.length > 70) collision = collision.slice(0, 67) + '...';
      tp2.textContent = collision.toUpperCase();
      text2.appendChild(tp2);
      gText.appendChild(text2);
    }

    svg.appendChild(gText);
  }

  // ── Clear and replace ──
  backdrop.innerHTML = '';
  backdrop.appendChild(svg);
}

// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════

let STATE = null;

async function loadState() {
  // Prefer the JS embed (works on file:// too — no CORS).
  if (window.__GRIMOIRE_STATE__) {
    STATE = window.__GRIMOIRE_STATE__;
    return STATE;
  }
  try {
    const res = await fetch('state.json?_=' + Date.now());
    STATE = await res.json();
  } catch {
    STATE = null;
  }
  return STATE;
}

// ═══════════════════════════════════════════════════════════════
// TERMINAL
// ═══════════════════════════════════════════════════════════════

const bootEl = document.getElementById('boot-text');
const artEl = document.getElementById('title-art');
const obsEl = document.getElementById('obsession');
const fragEl = document.getElementById('fragments');
const outputEl = document.getElementById('output');
const cmdEl = document.getElementById('cmd-input');
const footCycle = document.getElementById('foot-cycle');
const footRun = document.getElementById('foot-run');
const footBuilt = document.getElementById('foot-built');
const burnEl = document.getElementById('burn-cover');

function typewriter(el, text, speed = 10, cb) {
  let i = 0;
  el.textContent = '';
  function tick() {
    if (i < text.length) {
      el.textContent += text[i];
      i++;
      // Speed varies by character
      const delay = text[i-1] === '\n' ? speed * 4 : speed;
      setTimeout(tick, delay);
    } else if (cb) {
      cb();
    }
  }
  tick();
}

function renderFragments(state) {
  fragEl.innerHTML = '';
  if (!state || !state.fragments) return;
  for (const f of state.fragments) {
    const div = document.createElement('div');
    div.className = 'frag-entry';
    if (f.type && f.type !== 'passage' && f.type !== 'silence' && f.type !== 'history') {
      div.classList.add('collision-' + f.type);
    }
    const src = document.createElement('div');
    src.className = 'src';
    src.textContent = `◈ ${f.source || 'unknown'} ${f.collision ? '· ' + f.collision.slice(0,80) : ''}`;
    div.appendChild(src);
    const txt = document.createElement('div');
    txt.className = 'txt';
    txt.textContent = f.text || '';
    div.appendChild(txt);
    fragEl.appendChild(div);
  }
}

function render(state) {
  if (!state) {
    obsEl.style.display = 'none';
    footCycle.textContent = 'ERR: state.json not found';
    return;
  }
  obsEl.style.display = 'block';
  const label = document.createElement('span');
  label.className = 'label';
  label.textContent = 'CURRENT OBSESSION';
  obsEl.innerHTML = '';
  obsEl.appendChild(label);
  obsEl.appendChild(document.createTextNode(' '));
  const text = document.createElement('span');
  text.className = 'text';
  text.textContent = state.obsession || '—';
  obsEl.appendChild(text);

  renderFragments(state);
  footCycle.textContent = `∎ cycle ${state.cycles || '?'}`;
  footRun.textContent = state.source_type === 'phase4' ? `phase4 r${state.run_n || '?'}` : 'library harvest';
  footBuilt.textContent = `built ${(state.generated_at || '').slice(0, 10)}`;
}

const COMMANDS = {
  help() {
    return `available commands:
  help       — this list
  sigil <word> — render a sigil for any word
  read       — scroll the fragments
  obsess     — show current obsession
  trace      — show mutation log
  burn       — transmute the page (re-seed client-side)
  scry       — toggle full-view sigil mode
  status     — show cycle & source info
  clear      — clear output`;
  },
  read() {
    if (!STATE || !STATE.fragments || STATE.fragments.length === 0) return 'the void is silent.';
    return STATE.fragments.map((f, i) => {
      return `[${i+1}] ${f.source}\n    ${f.text.slice(0, 200)}`;
    }).join('\n\n');
  },
  obsess() {
    if (!STATE) return 'grimoire not loaded.';
    return `current obsession:\n  ${STATE.obsession}\n\ncollision in view:\n  ${STATE.collision || 'none'}`;
  },
  trace() {
    if (!STATE) return 'no state.';
    return `cycle ${STATE.cycles} · seed ${STATE.seed}\nsource: ${STATE.source_type || 'unknown'}\nrun: ${STATE.run_n || '?'}\ntimestamp: ${STATE.generated_at || '?'}`;
  },
  status() {
    if (!STATE) return 'grimoire offline.';
    const fcount = (STATE.fragments || []).length;
    return `cycle ${STATE.cycles} · ${fcount} fragments\n${STATE.source_type === 'phase4' ? 'fed by phase4 loop (r' + STATE.run_n + ')' : 'fallback: random library harvest'}\nobsession: ${(STATE.obsession || '').slice(0, 60)}...`;
  },
  sigil(word) {
    if (!word) return 'sigil <word> — provide a word to shape the sigil.';
    buildSigil(word, STATE);
    return `sigil seeded from "${word}". watch the weave.`;
  },
  async burn() {
    burnEl.classList.add('active');
    await new Promise(r => setTimeout(r, 500));
    buildSigil(Date.now().toString(16), STATE);
    burnEl.classList.remove('active');
    return 'transmutation complete. the sigil has turned.';
  },
  scry() {
    const bp = document.getElementById('sigil-backdrop');
    const app = document.getElementById('app');
    if (bp.style.opacity === '1') {
      bp.style.opacity = '0.35';
      app.style.display = 'flex';
      return 'returning to terminal.';
    } else {
      bp.style.opacity = '1';
      app.style.display = 'none';
      return 'scrying... press any key to return.';
    }
  },
  clear() { outputEl.innerHTML = ''; return null; },
};

// ── keyboard handler ──
cmdEl.addEventListener('keydown', async (e) => {
  if (e.key === 'Enter') {
    const input = cmdEl.value.trim();
    cmdEl.value = '';
    const pre = document.createElement('div');
    pre.style.opacity = '0.5';
    pre.textContent = `❯ ${input}`;
    outputEl.appendChild(pre);
    const [cmd, ...args] = input.split(' ');
    const fn = COMMANDS[cmd.toLowerCase()];
    if (fn) {
      const result = await fn(args.join(' '));
      if (result !== null) {
        const res = document.createElement('div');
        res.textContent = result;
        res.style.whiteSpace = 'pre-wrap';
        outputEl.appendChild(res);
      }
    } else if (input) {
      const res = document.createElement('div');
      res.textContent = `unknown command: ${cmd}. type help.`;
      res.style.color = '#884422';
      outputEl.appendChild(res);
    }
    outputEl.scrollTop = outputEl.scrollHeight;
  }
});

// ── scry return (any key) ──
document.addEventListener('keydown', () => {
  const bp = document.getElementById('sigil-backdrop');
  const app = document.getElementById('app');
  if (bp.style.opacity === '1') {
    bp.style.opacity = '0.35';
    app.style.display = 'flex';
  }
});

// ═══════════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════════

async function boot() {
  // Art goes into a dedicated pre element — never cleared by typewriter
  artEl.textContent = ART;

  // Load state
  const state = await loadState();

  // Build sigil backdrop
  buildSigil(state ? state.seed : 'default', state);

  // Render once (terminal content)
  render(state);

  // Typewriter boot sequence
  const bootText = BOOT_LINES.join('\n');
  typewriter(bootEl, bootText, 10, () => {
    // Focus input
    cmdEl.focus();
  });

  // Update cycle
  if (state) {
    footCycle.textContent = `∎ cycle ${state.cycles || '?'}`;
  }
}

boot();
</script>
